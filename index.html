<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#06060c">
  <title>Jinn — The Ancient Oracle of Minds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body class="theme-midnight">
  <!-- Dynamic Atmospheric Canvas Backdrop -->
  <div class="cosmos-bg" aria-hidden="true">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <canvas id="ambient-canvas"></canvas>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-layout">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-crest">
          <svg viewBox="0 0 24 24" class="crest-svg" fill="none" stroke="currentColor">
            <polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5" stroke-width="1.8" />
            <circle cx="12" cy="12" r="3.5" fill="currentColor" />
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">JINN</span>
          <span class="brand-sub">Oracle of Minds</span>
        </div>
      </div>

      <nav class="app-nav">
        <button id="themeBtn" class="nav-pill" title="Cycle Oracle Theme">
          <img src="assets/icons/palette.svg" class="icon" alt="" />
          <span id="themeName">Midnight Tomb</span>
        </button>
        <button id="musicBtn" class="nav-pill" title="Atmospheric Soundscape">
          <img src="assets/icons/music-off.svg" class="icon" alt="" />
          <span id="musicLabel">Music</span>
        </button>
        <button data-action="how" class="nav-subtle" title="How to play">
          <img src="assets/icons/info.svg" class="icon" alt="" />
          <span>Rules</span>
        </button>
        <button data-action="stats" class="nav-subtle" title="Archives & Stats">
          <img src="assets/icons/stats.svg" class="icon" alt="" />
          <span>Archives</span>
        </button>
        <button id="loginBtn" class="nav-pill nav-profile">
          <img src="assets/icons/ankh.svg" class="icon" alt="" />
          <span id="profileName">Sign In</span>
        </button>
      </nav>
    </header>

    <!-- Main Active Workspace Card -->
    <main class="oracle-container">
      <div id="game-card" class="oracle-card">
        <!-- Rendered reactively via app.js -->
      </div>
    </main>
  </div>

  <!-- Shared Modal Component -->
  <div class="modal-backdrop" id="modal">
    <div class="modal-card">
      <header class="modal-header">
        <h3 id="modal-title">Oracle Notice</h3>
        <button class="modal-close" data-close>
          <img src="assets/icons/close.svg" alt="Close" />
        </button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
